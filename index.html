<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>shack-mini</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span id="tb-title">shack-mini</span>
      <span id="tb-floor"></span>
      <span id="tb-turn"></span>
      <span id="tb-best"></span>
      <button type="button" id="tb-settings" data-action="settings" aria-label="設定">⚙</button>
    </header>
    <main id="map-wrap">
      <canvas id="map"></canvas>
      <div id="overlay" hidden></div>
      <div id="settings" hidden></div>
    </main>
    <section id="log"></section>
    <section id="panel"></section>
    <nav id="actions"></nav>
    <nav id="controls">
      <button type="button" data-action="next">次のユニット</button>
      <button type="button" data-action="end">ターン終了</button>
      <button type="button" data-action="overview">全体マップ</button>
    </nav>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
